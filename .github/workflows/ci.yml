name: Expo checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: App feature tests
        run: npm run test:app
      - name: Expo project diagnostics
        run: npx expo-doctor
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Kokoro server and run unit tests
        run: |
          python -m compileall -q server
          python -m unittest server.tests.test_tts_core server.tests.test_auth
