name: Expo checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, release/1.1.1-online-ai-reader]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: App feature tests
        run: npm run test:app
      - name: Expo project diagnostics
        run: npx expo-doctor
      - name: Dependency security audit
        run: |
          npm audit --audit-level=moderate --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const allowedAdvisories = new Set([
            'GHSA-5p2g-fcmc-qvqq',
            'GHSA-w3rx-r6r6-pgpr',
          ]);
          // These advisories currently have no published patched image-size release.
          // Permit only dependency chains that resolve exclusively to these two IDs.
          // New or unrelated vulnerabilities continue to fail the CI gate.
          function onlyKnownImageSizeAdvisory(name, visiting = new Set()) {
            const item = vulnerabilities[name];
            if (!item) return false;
            if (visiting.has(name)) return true;
            const next = new Set(visiting);
            next.add(name);
            return item.via.length > 0 && item.via.every((entry) => {
              if (typeof entry === 'string') return onlyKnownImageSizeAdvisory(entry, next);
              return allowedAdvisories.has(entry.source);
            });
          }
          const unexpected = Object.entries(vulnerabilities)
            .filter(([name, item]) => item.severity === 'critical' ||
              ['high', 'moderate'].includes(item.severity) && !onlyKnownImageSizeAdvisory(name))
            .map(([name, item]) => ({ name, severity: item.severity, via: item.via }));
          if (unexpected.length) {
            console.error('Unexpected dependency vulnerabilities:', JSON.stringify(unexpected, null, 2));
            process.exit(1);
          }
          const accepted = Object.keys(vulnerabilities);
          console.log('No unexpected dependency vulnerabilities.');
          if (accepted.length) console.log('Scoped, unpatched Metro/image-size advisory chain:', accepted.join(', '));
          NODE
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python dependency security audit
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r server/requirements.txt
      - name: Validate Kokoro server and run unit tests
        run: |
          python -m compileall -q server
          python -m unittest server.tests.test_tts_core server.tests.test_auth
