name: Publish OTA update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-update.yml
  workflow_dispatch:
    inputs:
      message:
        description: Update notes
        required: true
        default: Bug fixes and improvements
        type: string

permissions:
  contents: read

concurrency:
  group: ota-publish-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-ota]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restrict production OTA to main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production OTA is restricted to the main branch. Do not dispatch this workflow from a release or feature branch."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate app before publishing
        run: |
          npm run typecheck
          npm run test:app
          npm audit --audit-level=moderate
      - name: Validate Expo OTA configuration
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
          APP_UPDATE_CHANNEL: production
        run: |
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Missing EAS_PROJECT_ID repository variable."
            exit 1
          fi
          npx expo config --type public --json > expo-config.json
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("expo-config.json", "utf8"));
            const projectId = config.extra?.eas?.projectId;
            const updateUrl = config.updates?.url;
            if (projectId !== process.env.EAS_PROJECT_ID) throw new Error("Resolved EAS project ID does not match EAS_PROJECT_ID.");
            if (config.slug !== "xiaoshuo") throw new Error("Expo slug must match the linked xiaoshuo project.");
            if (updateUrl !== "https://u.expo.dev/" + process.env.EAS_PROJECT_ID) throw new Error("Expo Updates URL is missing or incorrect.");
            if (!config.runtimeVersion) throw new Error("runtimeVersion is required for OTA compatibility.");
            const channel = process.env.APP_UPDATE_CHANNEL;
            if (config.updates?.requestHeaders?.["expo-channel-name"] !== channel) throw new Error("Embedded OTA channel does not match the publish channel.");
            console.log("OTA configuration validated for", projectId, "slug", config.slug, "channel", channel);
          '
      - name: Verify production channel mapping before publishing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
        run: |
          npx eas-cli@27.11.0 channel:view production --json --non-interactive > "$RUNNER_TEMP/production-channel.json"
          node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/production-channel.json", "utf8"));
            const channel = result.currentPage;
            const branches = channel?.updateBranches || [];
            if (channel?.name !== "production" || channel.isPaused || !branches.some((branch) => branch.name === "production")) {
              console.error("Production channel is not active or does not point to the production branch:", JSON.stringify({ name: channel?.name, isPaused: channel?.isPaused, branches: branches.map((branch) => branch.name) }));
              process.exit(1);
            }
            console.log("Verified active production channel -> production branch.");
          '
      - name: Publish iOS Expo Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
          UPDATE_CHANNEL: production
          UPDATE_MESSAGE: ${{ inputs.message || format('Automatic OTA update {0}', github.sha) }}
          APP_UPDATE_CHANNEL: production
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret."
            exit 1
          fi
          set -euo pipefail
          npx eas-cli@27.11.0 update --channel "$UPDATE_CHANNEL" --message "$UPDATE_MESSAGE" --platform ios --non-interactive 2>&1 | tee "$RUNNER_TEMP/eas-update.log"
          UPDATE_ID="$(sed -nE 's/^iOS update ID[[:space:]]+([[:xdigit:]-]+).*$/\1/p' "$RUNNER_TEMP/eas-update.log" | tail -n 1)"
          if [ -z "$UPDATE_ID" ]; then
            echo "::error::Could not read the published iOS update ID."
            exit 1
          fi
          echo "PUBLISHED_UPDATE_ID=$UPDATE_ID" >> "$GITHUB_ENV"

      - name: Verify published OTA fingerprint
        if: inputs.target != 'v1.1.0-only'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
          APP_UPDATE_CHANNEL: production
        run: |
          npx eas-cli@27.11.0 fingerprint:compare --update-id "$PUBLISHED_UPDATE_ID" --json --non-interactive > "$RUNNER_TEMP/fingerprint-compare.json"
          node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/fingerprint-compare.json", "utf8"));
            const published = result.fingerprint1?.hash;
            const local = result.fingerprint2?.hash;
            if (!published || !local || published !== local) {
              console.error("OTA fingerprint mismatch:", JSON.stringify({ published, local }));
              process.exit(1);
            }
            console.log("Verified OTA runtime fingerprint:", published);
          '

      # Legacy runtime compatibility publishing is disabled because v1.2.0 adds native SecureStore.
      # Only the current fingerprint runtime is published to production.

