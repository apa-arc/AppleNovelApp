name: Build iOS app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript and feature tests
        run: |
          npm run typecheck
          npm run test:app
      - name: Validate Expo configuration
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Missing EAS_PROJECT_ID GitHub repository variable."
            exit 1
          fi
          npx expo config --type public --json > expo-config.json
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("expo-config.json", "utf8"));
            if (config.extra?.eas?.projectId !== process.env.EAS_PROJECT_ID) throw new Error("Resolved EAS project ID does not match EAS_PROJECT_ID.");
            if (config.updates?.url !== "https://u.expo.dev/" + process.env.EAS_PROJECT_ID) throw new Error("Expo Updates URL is missing or incorrect.");
            if (!config.runtimeVersion) throw new Error("runtimeVersion is required.");
            console.log("Expo build configuration validated.");
          '
      - name: Build iOS app with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN GitHub repository secret."
            exit 1
          fi
          npx eas-cli build --platform ios --profile "$BUILD_PROFILE" --non-interactive --wait
