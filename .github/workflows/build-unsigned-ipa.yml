name: Build unsigned iOS IPA

on:
  # Rebuild the IPA only when native configuration or dependencies change.
  # App.tsx/src changes are delivered through OTA instead.
  push:
    branches:
      - main
    paths:
      - "app.json"
      - "app.config.js"
      - "package.json"
      - "eas.json"
      - ".github/workflows/build-unsigned-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install JavaScript dependencies
        run: npm install

      - name: Run app checks
        run: |
          npm run typecheck
          npm run test:app

      - name: Validate OTA build settings
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
        run: |
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Set the EAS_PROJECT_ID repository variable once to enable OTA updates in this IPA."
            exit 1
          fi
          EAS_PROJECT_ID="$EAS_PROJECT_ID" APP_UPDATE_CHANNEL=production npx expo config --type public --json > expo-config.json
          node -e '
            const config = require("./expo-config.json");
            if (config.updates?.url !== "https://u.expo.dev/" + process.env.EAS_PROJECT_ID) throw new Error("Expo Updates URL is not configured.");
            if (config.updates?.requestHeaders?.["expo-channel-name"] !== "production") throw new Error("Production OTA channel is not embedded.");
            if (!config.runtimeVersion) throw new Error("runtimeVersion is required.");
            console.log("Unsigned IPA will use the production OTA channel.");
          '
      - name: Generate iOS runtime fingerprint
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
          APP_UPDATE_CHANNEL: production
        run: |
          npx eas-cli@latest fingerprint:generate --platform ios --json --non-interactive > "$RUNNER_TEMP/ios-fingerprint.json"
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/ios-fingerprint.json", "utf8"));
            const hash = data.hash || data.fingerprint?.hash || data.fingerprintHash;
            if (!/^[a-f0-9]{40}$/i.test(hash || "")) {
              console.error("Unexpected fingerprint output:", JSON.stringify(data).slice(0, 1000));
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, "IOS_RUNTIME_FINGERPRINT=" + hash + "\n");
            console.log("Resolved iOS runtime fingerprint:", hash);
          '

      - name: Generate iOS native project
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
          APP_UPDATE_CHANNEL: production
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ env.IOS_RUNTIME_FINGERPRINT }}
        run: |
          test -n "$EXPO_UPDATES_FINGERPRINT_OVERRIDE"
          npx expo prebuild --platform ios --clean
          EXPO_PLIST="$(find ios -name Expo.plist -print -quit)"
          test -n "$EXPO_PLIST"
          EMBEDDED_CHANNEL="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRequestHeaders:expo-channel-name' "$EXPO_PLIST")"
          echo "Prebuild channel: $EMBEDDED_CHANNEL"
          test "$EMBEDDED_CHANNEL" = "production"

      - name: Install iOS pods
        run: npx pod-install

      - name: Build unsigned iOS app
        shell: bash
        env:
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ env.IOS_RUNTIME_FINGERPRINT }}
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::Expo did not generate an Xcode workspace."
            exit 1
          fi
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" 2>/dev/null | ruby -rjson -e 'j=JSON.parse(STDIN.read); puts j.dig("workspace","schemes")&.find { |s| !s.start_with?("Pods-") }')"
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not determine the application Xcode scheme."
            exit 1
          fi
          echo "Building scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AppleNovelDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP_PATH="$(find "$RUNNER_TEMP/AppleNovelDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Xcode build completed without an .app bundle."
            exit 1
          fi
          APP_EXPO_PLIST="$APP_PATH/Expo.plist"
          APP_RUNTIME="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' "$APP_EXPO_PLIST")"
          APP_CHANNEL="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRequestHeaders:expo-channel-name' "$APP_EXPO_PLIST")"
          echo "Built app runtime: $APP_RUNTIME"
          echo "Built app channel: $APP_CHANNEL"
          test "$APP_RUNTIME" = "$IOS_RUNTIME_FINGERPRINT"
          test "$APP_CHANNEL" = "production"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/AppleNovelApp-unsigned.ipa" Payload)
          test -s "$GITHUB_WORKSPACE/AppleNovelApp-unsigned.ipa"
          echo "Unsigned IPA created."

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppleNovelApp-unsigned-IPA
          path: AppleNovelApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
