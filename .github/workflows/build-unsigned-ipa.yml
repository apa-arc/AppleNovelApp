name: Build unsigned iOS IPA

on:
  # Rebuild the IPA only when native configuration or dependencies change.
  # App.tsx/src changes are delivered through OTA instead.
  push:
    branches:
      - main
      - feature/tomato-style-audiobook-1.0.7
      - release/1.0.9-search-cover-grid
      - release/1.1.0-tomato-reader
      - release/1.1.1-online-ai-reader
    tags:
      - v1.1.1
    paths:
      - "app.json"
      - "assets/icon.png.base64"
      - "app.config.js"
      - "package.json"
      - "package-lock.json"
      - "App.tsx"
      - "src/**"
      - "scripts/**"
      - "eas.json"
      - "scripts/patch-sherpa-native.js"
      - ".github/workflows/build-unsigned-ipa.yml"
      - ".github/workflows/publish-update.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app.json"
      - "assets/icon.png.base64"
      - "app.config.js"
      - "package.json"
      - "package-lock.json"
      - "eas.json"
      - ".github/workflows/build-unsigned-ipa.yml"
      - ".github/workflows/publish-update.yml"
  workflow_dispatch:

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install JavaScript dependencies
        run: npm install

      - name: Restore app icon asset
        run: |
          mkdir -p assets
          base64 -D -i assets/icon.png.base64 -o assets/icon.png
          test -s assets/icon.png
          file assets/icon.png

      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -e '
            require "yaml"
            %w[.github/workflows/build-unsigned-ipa.yml .github/workflows/publish-update.yml].each do |path|
              YAML.load_file(path)
              puts "Valid YAML: #{path}"
            end
          '
      - name: Run app checks
        run: |
          npm run typecheck
          npm run test:app
          npm audit --audit-level=moderate

      - name: Validate OTA build settings
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
        run: |
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "::error::Set the EAS_PROJECT_ID repository variable once to enable OTA updates in this IPA."
            exit 1
          fi
          EAS_PROJECT_ID="$EAS_PROJECT_ID" APP_UPDATE_CHANNEL=production npx expo config --type public --json > expo-config.json
          node -e '
            const config = require("./expo-config.json");
            if (config.updates?.url !== "https://u.expo.dev/" + process.env.EAS_PROJECT_ID) throw new Error("Expo Updates URL is not configured.");
            if (config.updates?.requestHeaders?.["expo-channel-name"] !== "production") throw new Error("Production OTA channel is not embedded.");
            if (!config.runtimeVersion) throw new Error("runtimeVersion is required.");
            if (config.icon !== "./assets/icon.png") throw new Error("App icon is not configured.");
            console.log("Unsigned IPA will use the production OTA channel and custom app icon.");
          '
      - name: Generate iOS runtime fingerprint
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
          APP_UPDATE_CHANNEL: production
        run: |
          npx eas-cli@27.11.0 fingerprint:generate --platform ios --json --non-interactive > "$RUNNER_TEMP/ios-fingerprint.json"
          IOS_RUNTIME_FINGERPRINT="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/ios-fingerprint.json", "utf8"));
            const hash = data.hash || data.fingerprint?.hash || data.fingerprintHash;
            if (!/^[a-f0-9]{40}$/i.test(hash || "")) {
              console.error("Unexpected fingerprint output:", JSON.stringify(data).slice(0, 1000));
              process.exit(1);
            }
            process.stdout.write(hash);
          ')"
          echo "IOS_RUNTIME_FINGERPRINT=$IOS_RUNTIME_FINGERPRINT" >> "$GITHUB_ENV"
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$IOS_RUNTIME_FINGERPRINT" >> "$GITHUB_ENV"
          echo "Resolved iOS runtime fingerprint: $IOS_RUNTIME_FINGERPRINT"


      - name: Compare iOS runtime fingerprint with 1.1.0 baseline
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
          APP_UPDATE_CHANNEL: production
        run: |
          set -euo pipefail
          BASE_SHA=23ab2562809e03ff54ee47a270e868b9144c8d64
          BASE_DIR="$RUNNER_TEMP/novel-1.1.0-baseline"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          mkdir -p "$BASE_DIR/assets"
          base64 -D -i "$BASE_DIR/assets/icon.png.base64" -o "$BASE_DIR/assets/icon.png"
          (
            cd "$BASE_DIR"
            npm install
            npx eas-cli@27.11.0 fingerprint:generate --platform ios --json --non-interactive > "$RUNNER_TEMP/ios-fingerprint-1.1.0.json"
          )
          node -e '
            const fs = require("fs");
            const read = (name) => JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/" + name, "utf8"));
            const current = read("ios-fingerprint.json");
            const baseline = read("ios-fingerprint-1.1.0.json");
            const sources = (value) => value.sources || value.fingerprint?.sources || [];
            const key = (source) => source.id || source.filePath || source.name || JSON.stringify(source);
            const hash = (source) => source.hash ?? source.hex ?? null;
            const before = new Map(sources(baseline).map((source) => [key(source), hash(source)]));
            const after = new Map(sources(current).map((source) => [key(source), hash(source)]));
            const names = [...new Set([...before.keys(), ...after.keys()])].sort();
            const changed = names.filter((name) => before.get(name) !== after.get(name));
            console.log("1.1.0 runtime fingerprint:", baseline.hash || baseline.fingerprint?.hash);
            console.log("1.1.1 runtime fingerprint:", current.hash || current.fingerprint?.hash);
            console.log("Fingerprint source count:", before.size, "->", after.size);
            console.log("Changed fingerprint sources:", JSON.stringify(changed.map((name) => ({ name, baseline: before.get(name), current: after.get(name) })), null, 2));
          '


      - name: Generate iOS native project
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || 'b4d937a0-68db-426d-8114-c4b41cc1d9d4' }}
          APP_UPDATE_CHANNEL: production
        run: |
          test -n "$EXPO_UPDATES_FINGERPRINT_OVERRIDE"
          npx expo prebuild --platform ios --clean
          EXPO_PLIST="$(find ios -name Expo.plist -print -quit)"
          test -n "$EXPO_PLIST"
          EMBEDDED_CHANNEL="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRequestHeaders:expo-channel-name' "$EXPO_PLIST")"
          echo "Prebuild channel: $EMBEDDED_CHANNEL"
          test "$EMBEDDED_CHANNEL" = "production"

      - name: Install iOS pods
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx pod-install

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" 2>/dev/null | ruby -rjson -e 'j=JSON.parse(STDIN.read); puts j.dig("workspace","schemes")&.find { |s| !s.start_with?("Pods-") }')"
          test -n "$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/AppleNovelDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP_PATH="$(find "$RUNNER_TEMP/AppleNovelDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          APP_EXPO_PLIST="$APP_PATH/Expo.plist"
          APP_RUNTIME_POLICY="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' "$APP_EXPO_PLIST")"
          APP_CHANNEL="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRequestHeaders:expo-channel-name' "$APP_EXPO_PLIST")"
          APP_FINGERPRINT_FILE="$APP_PATH/EXUpdates.bundle/fingerprint"
          test -s "$APP_FINGERPRINT_FILE"
          APP_FINGERPRINT="$(cat "$APP_FINGERPRINT_FILE")"
          test "$APP_RUNTIME_POLICY" = "file:fingerprint"
          test "$APP_FINGERPRINT" = "$IOS_RUNTIME_FINGERPRINT"
          test "$APP_CHANNEL" = "production"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          IPA_PATH="$GITHUB_WORKSPACE/AppleNovelApp-unsigned.ipa"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$IPA_PATH" Payload)
          test -s "$IPA_PATH"
          /usr/bin/unzip -tq "$IPA_PATH"
          IPA_ENTRIES="$(/usr/bin/unzip -Z1 "$IPA_PATH")"
          echo "$IPA_ENTRIES" | grep -Eq '^Payload/[^/]+[.]app/Info[.]plist$'
          FINAL_EXPO_PLIST="$RUNNER_TEMP/ipa/Payload/$(basename "$APP_PATH")/Expo.plist"
          FINAL_CHANNEL="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRequestHeaders:expo-channel-name' "$FINAL_EXPO_PLIST")"
          test "$FINAL_CHANNEL" = "production"
          IPA_SHA256="$(/usr/bin/shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          IPA_SIZE="$(/usr/bin/stat -f%z "$IPA_PATH")"
          echo "Verified IPA: $IPA_SIZE bytes; SHA256=$IPA_SHA256; OTA channel=$FINAL_CHANNEL"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleNovelApp-unsigned-IPA
          path: AppleNovelApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Read and validate app version
        id: app-version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/tags/v1.1.1" ] && [ "$VERSION" != "1.1.1" ]; then
            echo "::error::The v1.1.1 release tag requires package.json version 1.1.1."
            exit 1
          fi

      - name: Publish version record to GitHub Releases
        if: github.ref == 'refs/tags/v1.1.1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: AppleNovelApp v1.1.1
          body: |
            AppleNovelApp 1.1.1 正式版。

            - 应用更新：通过 production OTA 通道（仅限原生运行环境兼容的安装版本）
            - 不提供需要用户重新签名安装的 IPA
            - iOS 构建产物仅保留在 Actions 内部验收 Artifact
            - 提交：${{ github.sha }}
          prerelease: false
          draft: false
          generate_release_notes: true
