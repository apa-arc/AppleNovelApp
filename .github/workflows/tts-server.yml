name: Kokoro TTS server checks

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/tts-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/tts-server.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile server modules
        run: python -m compileall -q server
      - name: Validate model download shell script
        run: sh -n server/download-model.sh
      - name: Run server unit tests
        run: python -m unittest server.tests.test_tts_core server.tests.test_auth
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Start Kokoro server and wait for real model initialization
        run: |
          ENROLLMENT_CODE="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          cp .env.example .env
          sed -i "s|^SPEECH_ENROLLMENT_CODE=.*|SPEECH_ENROLLMENT_CODE=$ENROLLMENT_CODE|" .env
          docker compose up -d --build
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail http://127.0.0.1:8000/health -o /tmp/kokoro-health.json; then
              STATUS="$(python -c 'import json; print(json.load(open("/tmp/kokoro-health.json"))["status"])')"
              if [ "$STATUS" = "ok" ]; then
                python -c 'import json; d=json.load(open("/tmp/kokoro-health.json")); assert d["model"] == "kokoro-multi-lang-v1_1" and d["speaker_count"] == 103'
                break
              fi
            fi
            if [ "$attempt" -eq 90 ]; then
              docker compose logs --no-color
              echo "::error::Kokoro model did not become ready within 7.5 minutes."
              exit 1
            fi
            sleep 5
          done
          echo "Kokoro server is ready with all 103 speakers."
          echo "SPEECH_ENROLLMENT_CODE=$ENROLLMENT_CODE" >> "$GITHUB_ENV"
      - name: Test device enrollment and real WAV synthesis
        run: |
          TOKEN="$(curl --silent --show-error --fail \
            -X POST http://127.0.0.1:8000/v1/devices/enroll \
            -H 'Content-Type: application/json' \
            -d "$(python -c 'import json,os; print(json.dumps({"enrollment_code": os.environ["SPEECH_ENROLLMENT_CODE"]}))')" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          curl --silent --show-error --fail \
            -X POST http://127.0.0.1:8000/v1/audio/speech \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"model":"kokoro-multi-lang-v1_1","speaker_id":3,"text":"你好，欢迎使用私人小说。","speed":1.0}' \
            --output /tmp/kokoro-smoke.wav
          python - <<'PY'
          from pathlib import Path
          wav = Path("/tmp/kokoro-smoke.wav").read_bytes()
          assert wav[:4] == b"RIFF" and wav[8:12] == b"WAVE" and len(wav) > 44
          print(f"Generated valid Kokoro WAV: {len(wav)} bytes")
          PY
          curl --silent --show-error --fail -X POST \
            http://127.0.0.1:8000/v1/devices/revoke \
            -H "Authorization: Bearer $TOKEN"
      - name: Show Kokoro container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Kokoro server
        if: always()
        run: docker compose down -v
