name: Offline Kokoro iOS native smoke test

concurrency:
  group: offline-kokoro-${{ github.event.pull_request.number || github.ref }}
  # A newer commit on the same PR supersedes a stuck simulator attempt.
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "app.json"
      - "App.tsx"
      - "src/reader-settings.ts"
      - "src/speech-engine.ts"
      - "src/speech-voice-catalog.ts"
      - "src/offline-kokoro-runtime.ts"
      - "src/wav-audio-playback.ts"
      - "src/wav-encoder.ts"
      - "scripts/**"
      - "plugins/**"
      - ".github/workflows/offline-kokoro-ios.yml"
  workflow_dispatch:

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JavaScript dependencies and apply native patch
        run: npm install
      - name: TypeScript and app feature tests
        run: |
          npm run typecheck
          npm run test:app
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Verify native downloader and SherpaOnnx autolinking
        run: |
          grep -R "RNBackgroundDownloader.setCompletionHandlerWithIdentifier" ios
          grep -R "RNBackgroundDownloader.h" ios
          grep -R "SWIFT_OBJC_BRIDGING_HEADER" ios/*.xcodeproj/project.pbxproj
          node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking react-native-config --json --platform ios > /tmp/react-native-config.json
          node -e "const c=require('/tmp/react-native-config.json'); for (const name of ['react-native-sherpa-onnx','@kesha-antonov/react-native-background-downloader']) { const p=c.dependencies?.[name]?.platforms?.ios?.podspecPath; if (!p) throw new Error(name + ' is not autolinked for iOS'); console.log(name + ': ' + p); }"
      - name: Install CocoaPods
        env:
          # SherpaOnnx downloads its prebuilt iOS framework through the GitHub API.
          # Authenticate this request to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ios
          pod install
      - name: Build iOS Simulator app without signing
        run: |
          xcodebuild \
            -quiet \
            -workspace ios/app.xcworkspace \
            -scheme app \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Launch simulator and verify SherpaOnnx TurboModule registration
        timeout-minutes: 10
        run: |
          APP_PATH="$(find build/ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          DEVICE_ID="$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/ && !seen++ {print $2; exit}')"
          if [ -z "$APP_PATH" ] || [ -z "$DEVICE_ID" ]; then
            echo "::error::Unable to locate the built iOS app or an available iPhone simulator."
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          # Debug React Native apps need Metro; without it the app cannot load App.tsx.
          CI=1 npx expo start --dev-client --localhost --port 8081 > /tmp/expo-metro.log 2>&1 &
          METRO_PID=$!
          READY=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/status >/dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/expo-metro.log
            kill "$METRO_PID" || true
            echo "::error::Expo Metro did not become ready for the simulator smoke test."
            exit 1
          fi
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.apaarc.applenovelapp
          # Give Metro time to finish the initial bundle, then wait for the native
          # runtime marker instead of checking after a fixed short delay.
          READY_MARKER=0
          for attempt in $(seq 1 90); do
            if grep -Fq '[KOKORO_NATIVE_READY]' /tmp/expo-metro.log; then
              READY_MARKER=1
              break
            fi
            sleep 2
          done
          echo "Expo Metro log:"
          tail -n 150 /tmp/expo-metro.log || true
          if [ "$READY_MARKER" -ne 1 ]; then
            echo "::error::SherpaOnnx TurboModule did not emit its runtime ready marker within 180 seconds."
            exit 1
          fi
          echo "Verified SherpaOnnx TurboModule runtime ready marker in Metro output."
