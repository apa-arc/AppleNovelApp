name: Offline Kokoro iOS native smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "app.json"
      - "plugins/**"
      - "patches/**"
      - "App.tsx"
      - "src/reader-settings.ts"
      - "src/offline-kokoro-runtime.ts"
      - "src/wav-encoder.ts"
      - "scripts/wav-encoder.test.cjs"
      - ".github/workflows/offline-kokoro-ios.yml"
  workflow_dispatch:

jobs:
  ios-simulator-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JavaScript dependencies
        run: npm install
      - name: TypeScript and WAV encoder tests
        run: |
          npm run typecheck
          npm run test:wav-encoder
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      - name: Build iOS Simulator app without signing
        run: |
          xcodebuild \
            -workspace ios/AppleNovelApp.xcworkspace \
            -scheme AppleNovelApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Launch simulator and verify SherpaOnnx TurboModule registration
        run: |
          APP_PATH="$(find build/ios/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          DEVICE_ID="$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/ && !seen++ {print $2; exit}')"
          if [ -z "$APP_PATH" ] || [ -z "$DEVICE_ID" ]; then
            echo "::error::Unable to locate the built iOS app or an available iPhone simulator."
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.apaarc.applenovelapp
          sleep 15
          LOG="$(xcrun simctl spawn "$DEVICE_ID" log show --style compact --last 2m --predicate 'eventMessage CONTAINS "KOKORO_NATIVE_READY" OR eventMessage CONTAINS "KOKORO_NATIVE_UNAVAILABLE"')"
          echo "$LOG"
          if ! echo "$LOG" | grep -q "KOKORO_NATIVE_READY"; then
            echo "::error::SherpaOnnx TurboModule did not report a successful native registration check."
            exit 1
          fi
